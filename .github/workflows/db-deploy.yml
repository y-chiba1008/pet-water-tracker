name: DB Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-deploy.yml'

# db push が並走すると migration の適用順が壊れるため、待たせて直列に実行する
concurrency:
  group: db-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Required reviewers による承認ゲート。承認されるまで push は実行されない
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: リモートプロジェクトに接続
        run: pnpm exec supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      # 適用前に差分を出しておく（失敗時の調査用）
      - name: 適用予定のマイグレーションを表示
        run: pnpm exec supabase migration list

      - name: マイグレーション適用
        run: pnpm exec supabase db push
