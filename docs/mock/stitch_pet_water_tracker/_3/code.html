    // Bowl Selection
    bowlCards.forEach(card => {
      card.addEventListener('click', () => {
        bowlCards.forEach(c => {
          c.classList.add('opacity-60');
          c.classList.remove('shadow-md');
        });
        card.classList.remove('opacity-60');
        card.classList.add('shadow-md');

        currentBowlHasCycle = card.dataset.hasCycle === "true";
        if (currentBowlHasCycle) {
          activeCycleSection.classList.remove('hidden');
          noCycleSection.classList.add('hidden');
          startVol = parseInt(card.dataset.startVol || '240', 10);
          displayStartVol.innerHTML = startVol + '<span class="font-label-sm text-label-sm ml-0.5">ml</span>';
          displayStartTime.textContent = card.dataset.startTime || '08:30';
          updateCalculation();
        } else {
          activeCycleSection.classList.add('hidden');
          noCycleSection.classList.remove('hidden');
        }
      });
    });

    // Real-time Calculation & Validation
    function updateCalculation() {
      const endValRaw = endVolumeInput.value.trim();
      const endVal = endValRaw === "" ? 0 : parseInt(endValRaw, 10);

      if (isNaN(endVal)) return;

      const diff = startVol - endVal;
      calcFormula.textContent = startVol + 'ml − ' + endVal + 'ml';

      if (endVal > startVol) {
        // Anomaly
        anomalyWarningBanner.classList.remove('hidden');
        calcPreviewCard.classList.remove('bg-water-tint');
        calcPreviewCard.classList.add('bg-status-warning-bg');
        calcResultDisplay.innerHTML = '<span class="text-status-warning">0</span><span class="font-headline-sm text-headline-sm ml-0.5 text-status-warning">ml</span>';
      } else {
        // Normal
        anomalyWarningBanner.classList.add('hidden');
        calcPreviewCard.classList.add('bg-water-tint');
        calcPreviewCard.classList.remove('bg-status-warning-bg');
        calcResultDisplay.innerHTML = diff + '<span class="font-headline-sm text-headline-sm ml-0.5">ml</span>';
      }
    }

    endVolumeInput.addEventListener('input', updateCalculation);

    // Quick Volume buttons
    document.querySelectorAll('.quick-vol-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        endVolumeInput.value = btn.dataset.fillVal;
        updateCalculation();
      });
    });

    // Preset for clean form
    document.querySelectorAll('.clean-preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        cleanStartVolumeInput.value = btn.dataset.presetVal;
      });
    });

    // Next cycle toggle
    nextCycleToggle.addEventListener('change', () => {
      if (nextCycleToggle.checked) {
        nextCycleSubform.classList.remove('hidden');
      } else {
        nextCycleSubform.classList.add('hidden');
      }
    });

    // Initial calculation trigger
    updateCalculation();

    // Save button micro-interaction
    saveRecordBtn.addEventListener('click', () => {
      saveSuccessToast.classList.remove('translate-y-32', 'opacity-0');
      saveSuccessToast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        saveSuccessToast.classList.add('translate-y-32', 'opacity-0');
        saveSuccessToast.classList.remove('translate-y-0', 'opacity-100');
      }, 2500);
    });
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/85 backdrop-blur-xl shadow-[0_-4px_16px_rgba(120,113,108,0.08)]" data-active-classes="text-primary font-semibold"><div class="h-16 max-w-screen-md mx-auto px-space-xs grid grid-cols-4 items-center"><a class="flex flex-col items-center justify-center gap-0.5 h-full min-w-[44px] min-h-[44px] text-text-secondary transition-colors duration-150 active:scale-95" data-path="home" href="#"><span class="material-symbols-outlined text-[24px]">water_drop</span><span class="font-label-sm text-label-sm">ホーム</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-0.5 h-full min-w-[44px] min-h-[44px] transition-colors duration-150 active:scale-95 text-primary font-semibold" data-path="bowl-record" href="#"><span class="material-symbols-outlined text-[24px]">bathtub</span><span class="font-label-sm text-label-sm">水皿交換</span></a><a class="flex flex-col items-center justify-center gap-0.5 h-full min-w-[44px] min-h-[44px] text-text-secondary transition-colors duration-150 active:scale-95" data-path="single-record" href="#"><span class="material-symbols-outlined text-[24px]">edit_note</span><span class="font-label-sm text-label-sm">個別給水</span></a><a class="flex flex-col items-center justify-center gap-0.5 h-full min-w-[44px] min-h-[44px] text-text-secondary transition-colors duration-150 active:scale-95" data-path="bowl-management" href="#"><span class="material-symbols-outlined text-[24px]">tune</span><span class="font-label-sm text-label-sm">水皿管理</span></a></div></nav>
