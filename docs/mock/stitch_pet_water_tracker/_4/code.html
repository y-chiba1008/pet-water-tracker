" id="single-record-form" onsubmit="event.preventDefault(); handleSaveRecord();"><div class="flex flex-col gap-space-xs"><div class="flex items-center justify-between"><label class="font-label-lg text-label-lg text-text-primary flex items-center gap-1.5" for="record-datetime"><span class="material-symbols-outlined text-[18px] text-water-deep">schedule</span><span class="">日時<span class="text-error font-bold ml-1">*</span></span></label><button class="font-label-sm text-label-sm text-water-deep hover:underline flex items-center gap-0.5" onclick="setNowTime()" type="button"><span class="material-symbols-outlined text-[14px]">update</span>現在時刻にする</button></div><div class="bg-surface-subtle rounded-xl px-space-md py-3 flex items-center gap-space-sm"><input class="w-full bg-transparent font-body-md text-body-md text-text-primary focus:outline-none" id="record-datetime" required="" type="datetime-local"></div></div><div class="flex flex-col gap-space-xs"><div class="flex items-center justify-between"><label class="font-label-lg text-label-lg text-text-primary flex items-center gap-1.5" for="intake-amount"><span class="material-symbols-outlined text-[18px] text-water-deep">glass_cup</span><span class="">飲水量<span class="text-error font-bold ml-1">*</span></span></label></div><div class="relative flex items-center bg-surface-subtle rounded-xl px-space-md py-space-sm transition-all focus-within:bg-surface-card focus-within:shadow-md"><input class="w-full bg-transparent font-metric-display text-metric-display text-text-primary focus:outline-none pr-12 text-center" id="intake-amount" max="500" min="1" placeholder="0" required="" step="1" type="number" value="15"><span class="absolute right-4 font-headline-md text-headline-md text-text-secondary select-none">ml</span></div><div class="flex flex-wrap items-center gap-2 pt-space-xs"><button type="button" onclick="addAmount(10)" class="px-3.5 py-1.5 rounded-full bg-surface-container hover:bg-surface-container-high active:scale-95 t <script>
  (function initSingleRecordView() {
    const inputAmount = document.getElementById('intake-amount');
    const inputDatetime = document.getElementById('record-datetime');
    const inputMemo = document.getElementById('record-memo');
    const toast = document.getElementById('toast-success');
    const toastMsg = document.getElementById('toast-message');
    const recordsContainer = document.getElementById('recent-records-list');
    const todayBadge = document.getElementById('today-total-badge');

    // Format Date to YYYY-MM-DDTHH:mm for datetime-local input
    function getLocalDateTimeString(date) {
      const pad = (n) => String(n).padStart(2, '0');
      const y = date.getFullYear();
      const m = pad(date.getMonth() + 1);
      const d = pad(date.getDate());
      const h = pad(date.getHours());
      const min = pad(date.getMinutes());
      return `${y}-${m}-${d}T${h}:${min}`;
    }

    window.setNowTime = function() {
      inputDatetime.value = getLocalDateTimeString(new Date());
    };

    setNowTime();

    window.addAmount = function(val) {
      const cur = parseInt(inputAmount.value, 10) || 0;
      inputAmount.value = cur + val;
      inputAmount.focus();
    };

    window.clearAmount = function() {
      inputAmount.value = '';
      inputAmount.focus();
    };

    window.selectPreset = function(text) {
      if (inputMemo.value && !inputMemo.value.includes(text)) {
        inputMemo.value = text + ' ' + inputMemo.value;
      } else if (!inputMemo.value) {
        inputMemo.value = text;
      }
      inputMemo.focus();
    };

    function showToast(text) {
      toastMsg.textContent = text;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    let todayTotal = 35;

    window.handleSaveRecord = function() {
      const amount = parseInt(inputAmount.value, 10);
      if (!amount || amount <= 0) return;

      const dateVal = new Date(inputDatetime.value || new Date());
      const hours = String(dateVal.getHours()).padStart(2, '0');
      const mins = String(dateVal.getMinutes()).padStart(2, '0');
      const timeStr = `今日 ${hours}:${mins}`;

      const memoText = inputMemo.value.trim() || 'シリンジ直接給水';

      // Insert new element to recent records feed
      const newCard = document.createElement('div');
      newCard.className = 'bg-surface-card rounded-xl p-space-md flex items-center justify-between shadow-xs transition hover:shadow-sm animate-pulse';
      newCard.innerHTML = `
        <div class="flex items-center gap-space-sm min-w-0">
          <div class="w-9 h-9 rounded-full bg-water-tint flex items-center justify-center text-water-deep flex-shrink-0">
            <span class="material-symbols-outlined text-[18px]">water_drop</span>
          </div>
          <div class="flex flex-col min-w-0">
            <div class="flex items-center gap-2">
              <span class="font-label-lg text-label-lg text-text-primary">${timeStr}</span>
              <span class="px-2 py-0.5 rounded-full bg-surface-subtle font-label-sm text-label-sm text-text-secondary truncate">個別記録</span>
            </div>
            <span class="font-body-sm text-body-sm text-text-secondary truncate">${memoText}</span>
          </div>
        </div>
        <div class="flex flex-col items-end flex-shrink-0 pl-2">
          <span class="font-headline-md text-headline-md text-water-deep font-bold">${amount}<span class="text-label-sm text-text-secondary font-normal ml-0.5">ml</span></span>
          <span class="font-label-sm text-label-sm text-text-tertiary">記録: ママ</span>
        </div>
      `;

      recordsContainer.insertBefore(newCard, recordsContainer.firstChild);

      // Remove pulse after brief delight indicator
      setTimeout(() => {
        newCard.classList.remove('animate-pulse');
      }, 700);

      // Update today's total
      todayTotal += amount;
      todayBadge.textContent = `${todayTotal} ml`;

      // Show toast and reset form values gracefully
      showToast(`飲水量 ${amount}ml を記録しました！🐾`);
      inputAmount.value = '15';
      inputMemo.value = '';
      setNowTime();
    };
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/85 backdrop-blur-xl shadow-[0_-4px_16px_rgba(120,113,108,0.08)]" data-active-classes="text-primary font-semibold"><div class="h-16 max-w-screen-md mx-auto px-space-xs grid grid-cols-4 items-center"><a class="flex flex-col items-center justify-center gap-0.5 h-full min-w-[44px] min-h-[44px] text-text-secondary transition-colors duration-150 active:scale-95" data-path="home" href="#"><span class="material-symbols-outlined text-[24px]">water_drop</span><span class="font-label-sm text-label-sm">ホーム</span></a><a class="flex flex-col items-center justify-center gap-0.5 h-full min-w-[44px] min-h-[44px] text-text-secondary transition-colors duration-150 active:scale-95" data-path="bowl-record" href="#"><span class="material-symbols-outlined text-[24px]">bathtub</span><span class="font-label-sm text-label-sm">水皿交換</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-0.5 h-full min-w-[44px] min-h-[44px] transition-colors duration-150 active:scale-95 text-primary font-semibold" data-path="single-record" href="#"><span class="material-symbols-outlined text-[24px]">edit_note</span><span class="font-label-sm text-label-sm">個別給水</span></a><a class="flex flex-col items-center justify-center gap-0.5 h-full min-w-[44px] min-h-[44px] text-text-secondary transition-colors duration-150 active:scale-95" data-path="bowl-management" href="#"><span class="material-symbols-outlined text-[24px]">tune</span><span class="font-label-sm text-label-sm">水皿管理</span></a></div></nav>
